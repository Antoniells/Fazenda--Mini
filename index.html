<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Fazenda</title>
    <style>
      /* O jogo ocupa a janela inteira (o Phaser escala 4:3 dentro dela, ver `scale.mode` em gameConfig.ts):
         sem margem do navegador nem barra de rolagem, e o preto de fundo vira as faixas em tela cheia 16:9. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
